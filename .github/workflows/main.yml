name: Build and Deploy

on:
  push:
    branches:
      - master

env:
  REGISTRY: registry.layusoft.com
  IMAGE_NAME: aspire/githubworkflow/orderapi
  ORDER_API_PORT: 2222

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish OrderApi/OrderApi.csproj -c Release -o publish

      - name: Login to Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login $REGISTRY -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t $REGISTRY/${IMAGE_NAME}:latest -f OrderApi/Dockerfile .

      - name: Push Image
        run: |
          docker push $REGISTRY/${IMAGE_NAME}:latest

  deploy:
    needs: build
    runs-on: aws

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Aspire CLI
        run: |
          dotnet tool install -g aspire.cli
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Generate Docker Compose from Aspire
        run: |
          aspire publish docker-compose --project Aspire.GithubWorkflow.AppHost/Aspire.GithubWorkflow.AppHost.csproj --output docker-compose.yml

      - name: Run compose up
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login $REGISTRY -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin
          cd Aspire.GihtubWorkflow.AppHost/aspire-output
          yq -i ".services.orderapi.ports = [\"${ORDER_API_PORT}:${ORDER_API_PORT}\"]" docker-compose.yaml
          docker compose pull
          docker compose up -d