name: Build and Deploy

on:
  push:
    branches:
      - master

env:
  REGISTRY: registry.layusoft.com
  IMAGE_NAME: ${{ github.repository }}/orderapi

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish OrderApi/OrderApi.csproj -c Release -o publish

      - name: Login to Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login $REGISTRY -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t $REGISTRY/${IMAGE_NAME}:latest .

      - name: Push Image
        run: |
          docker push $REGISTRY/${IMAGE_NAME}:latest